<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 540" width="1280" height="540">
  <defs>
    <linearGradient id="bgLight" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#faf9f5" />
      <stop offset="100%" stop-color="#f3f1eb" />
    </linearGradient>
  </defs>
  <rect width="1280" height="540" fill="url(#bgLight)" rx="14" />

  <!-- Header -->
  <text x="60" y="52" fill="#0f172a" font-family="Segoe UI, system-ui, sans-serif" font-size="24" font-weight="700">Fresh Zero-Broker Setup or Explicit Legacy Enrollment</text>
  <text x="60" y="78" fill="#475569" font-family="Consolas, monospace" font-size="13">Copilot confirms architecture, trust and costs. The LAN trial is separate; deployment paths are not live acceptance.</text>

  <!-- CASE 1 CARD: JOIN VIA INVITE -->
  <g transform="translate(60, 106)">
    <rect width="555" height="388" rx="14" fill="#ffffff" />
    <rect width="555" height="58" rx="14" fill="#ecfdf5" />
    <line x1="0" y1="58" x2="555" y2="58" stroke="#059669" stroke-opacity="0.25" />
    <rect width="555" height="388" rx="14" fill="none" stroke="#059669" stroke-width="2.5" />
    <circle cx="32" cy="29" r="10" fill="#059669" />
    <text x="54" y="26" fill="#064e3b" font-family="Segoe UI, system-ui, sans-serif" font-size="17" font-weight="700">LEGACY — Existing Broker Invite</text>
    <text x="54" y="45" fill="#047857" font-family="Consolas, monospace" font-size="12">Independently confirm issuer before any GitHub token use</text>

    <!-- Step 1 -->
    <g transform="translate(26, 82)">
      <rect width="503" height="74" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2" />
      <text x="18" y="25" fill="#059669" font-family="Consolas, monospace" font-size="13" font-weight="700">STEP 1 · Copy Invite from Existing Flock Owner</text>
      <text x="18" y="46" fill="#334155" font-family="Segoe UI, system-ui, sans-serif" font-size="13">Owner tells their Copilot: "Generate an invite for my other PCs"</text>
      <text x="18" y="64" fill="#64748b" font-family="Consolas, monospace" font-size="11">Or: "Invite @guest to owner/studio-team for 4 hours"</text>
    </g>

    <!-- Step 2 -->
    <g transform="translate(26, 172)">
      <rect width="503" height="84" rx="10" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="1.5" />
      <text x="18" y="25" fill="#065f46" font-family="Consolas, monospace" font-size="13" font-weight="700">STEP 2 · Confirm Independent Issuer Trust</text>
      <text x="18" y="46" fill="#0f172a" font-family="Consolas, monospace" font-size="12">"Read AGENTS.md and enroll with this legacy invite."</text>
      <text x="18" y="64" fill="#0f172a" font-family="Consolas, monospace" font-size="12">The invite's URL or key cannot establish its own trust.</text>
    </g>

    <!-- Step 3 -->
    <g transform="translate(26, 272)">
      <rect width="503" height="92" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2" />
      <text x="18" y="25" fill="#059669" font-family="Consolas, monospace" font-size="13" font-weight="700">STEP 3 · Approved Legacy Enrollment</text>
      <text x="18" y="46" fill="#334155" font-family="Consolas, monospace" font-size="12">• Explicit legacy selector + independently pinned issuer</text>
      <text x="18" y="64" fill="#334155" font-family="Consolas, monospace" font-size="12">• Reuse valid identity; reject malformed existing keys</text>
      <text x="18" y="82" fill="#334155" font-family="Consolas, monospace" font-size="12">• Consented startup; Windows runs at user sign-in</text>
    </g>
  </g>

  <!-- CASE 2 CARD: NEW FLOCK INSTANCE (BYO AZURE) -->
  <g transform="translate(665, 106)">
    <rect width="555" height="388" rx="14" fill="#ffffff" />
    <rect width="555" height="58" rx="14" fill="#f5f3ff" />
    <line x1="0" y1="58" x2="555" y2="58" stroke="#6d28d9" stroke-opacity="0.25" />
    <rect width="555" height="388" rx="14" fill="none" stroke="#6d28d9" stroke-width="2.5" />
    <circle cx="32" cy="29" r="10" fill="#6d28d9" />
    <text x="54" y="26" fill="#2e1065" font-family="Segoe UI, system-ui, sans-serif" font-size="17" font-weight="700">FRESH — Zero-Broker Owner Setup</text>
    <text x="54" y="45" fill="#5b21b6" font-family="Consolas, monospace" font-size="12">Signed Pages roster + explicit grants; no Token Broker</text>

    <!-- Step 1 -->
    <g transform="translate(26, 82)">
      <rect width="503" height="74" rx="10" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="1.5" />
      <text x="18" y="25" fill="#5b21b6" font-family="Consolas, monospace" font-size="13" font-weight="700">STEP 1 · Tell Your Copilot to Set Up a New Flock</text>
      <text x="18" y="46" fill="#0f172a" font-family="Consolas, monospace" font-size="12">"Set up a fresh Zero-Broker flock; confirm scope,</text>
      <text x="18" y="64" fill="#0f172a" font-family="Consolas, monospace" font-size="12">Azure costs and a dedicated public roster repository."</text>
    </g>

    <!-- Step 2 -->
    <g transform="translate(26, 172)">
      <rect width="503" height="84" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2" />
      <text x="18" y="25" fill="#6d28d9" font-family="Consolas, monospace" font-size="13" font-weight="700">STEP 2 · Confirm Resources and Publication</text>
      <text x="18" y="46" fill="#334155" font-family="Consolas, monospace" font-size="12">• SignalR Serverless + Service Bus Standard topics</text>
      <text x="18" y="64" fill="#334155" font-family="Consolas, monospace" font-size="12">• Actions-backed Pages publishes the signed roster</text>
      <text x="18" y="79" fill="#64748b" font-family="Consolas, monospace" font-size="11">• Confirm subscription, region, resource group and tool installs</text>
    </g>

    <!-- Step 3 -->
    <g transform="translate(26, 272)">
      <rect width="503" height="92" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2" />
      <text x="18" y="25" fill="#6d28d9" font-family="Consolas, monospace" font-size="13" font-weight="700">STEP 3 · Verify Identity and Local Grants</text>
      <text x="18" y="46" fill="#334155" font-family="Consolas, monospace" font-size="12">• Keep genesis/root and issuer secrets private</text>
      <text x="18" y="64" fill="#334155" font-family="Consolas, monospace" font-size="12">• Remote execution/transcripts need local grants</text>
      <text x="18" y="82" fill="#334155" font-family="Consolas, monospace" font-size="12">• Other PCs: bound invites or independently approved claims</text>
    </g>
  </g>
  <text x="60" y="522" fill="#475569" font-family="Consolas, monospace" font-size="12">SignalR Free has quotas; Service Bus Standard costs apply. No automatic migration or live deployment authority.</text>
</svg>
