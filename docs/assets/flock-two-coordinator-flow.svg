<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 390" width="1280" height="390">
  <defs>
    <linearGradient id="bgCoord" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#faf9f5" />
      <stop offset="100%" stop-color="#f3f1eb" />
    </linearGradient>
  </defs>
  <rect width="1280" height="390" fill="url(#bgCoord)" rx="14" />

  <text x="60" y="50" fill="#0f172a" font-family="Segoe UI, system-ui, sans-serif" font-size="23" font-weight="700">Legacy Cross-Machine Routing — Two Coordinators</text>
  <text x="60" y="75" fill="#475569" font-family="Consolas, monospace" font-size="13">&lt; 2s handoff is a target, not a delivery guarantee. Not the fresh Zero-Broker or separate LAN-trial adapter.</text>

  <!-- Step 1: Remote Sender -->
  <g transform="translate(60, 110)">
    <rect width="260" height="230" rx="12" fill="#ffffff" />
    <rect width="260" height="46" rx="12" fill="#ecfdf5" />
    <line x1="0" y1="46" x2="260" y2="46" stroke="#059669" stroke-opacity="0.25" />
    <rect width="260" height="230" rx="12" fill="none" stroke="#059669" stroke-width="2" />
    <text x="18" y="29" fill="#064e3b" font-family="Consolas, monospace" font-size="13" font-weight="700">1 · Remote PC or Azure Queue</text>
    <text x="18" y="74" fill="#0f172a" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="600">SignalR + Queue Evidence</text>
    <text x="18" y="100" fill="#334155" font-family="Consolas, monospace" font-size="11">• WSS latency depends on network</text>
    <text x="18" y="120" fill="#334155" font-family="Consolas, monospace" font-size="11">• Queue receipts distinguish</text>
    <text x="18" y="138" fill="#334155" font-family="Consolas, monospace" font-size="11">  Service Bus vs broker storage</text>
    <text x="18" y="166" fill="#334155" font-family="Consolas, monospace" font-size="11">• Check transport and VPN policy</text>
    <text x="18" y="184" fill="#334155" font-family="Consolas, monospace" font-size="11">  IPv4-first DNS is not a bypass</text>
  </g>

  <!-- Arrow 1 -> 2 -->
  <path d="M 326 225 L 372 225" stroke="#059669" stroke-width="2.5" />
  <polygon points="372,219 384,225 372,231" fill="#059669" />

  <!-- Step 2: Coordinator -->
  <g transform="translate(390, 110)">
    <rect width="260" height="230" rx="12" fill="#ffffff" />
    <rect width="260" height="46" rx="12" fill="#f0f9ff" />
    <line x1="0" y1="46" x2="260" y2="46" stroke="#0284c7" stroke-opacity="0.25" />
    <rect width="260" height="230" rx="12" fill="none" stroke="#0284c7" stroke-width="2" />
    <text x="18" y="29" fill="#0c4a6e" font-family="Consolas, monospace" font-size="13" font-weight="700">2 · Copilot Flock Coordinator</text>
    <text x="18" y="74" fill="#0f172a" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="600">Target: &lt; 2s Pass-Through</text>
    <text x="18" y="100" fill="#334155" font-family="Consolas, monospace" font-size="11">• Never blocks on heavy scans</text>
    <text x="18" y="120" fill="#334155" font-family="Consolas, monospace" font-size="11">• Forwards authorized discovery</text>
    <text x="18" y="138" fill="#334155" font-family="Consolas, monospace" font-size="11">  to Thread Tracker via native</text>
    <text x="18" y="156" fill="#334155" font-family="Consolas, monospace" font-size="11">  send_session_message</text>
    <text x="18" y="182" fill="#334155" font-family="Consolas, monospace" font-size="11">• Worker creation requires</text>
    <text x="18" y="200" fill="#334155" font-family="Consolas, monospace" font-size="11">  separate owner authority</text>
  </g>

  <!-- Arrow 2 -> 3 -->
  <path d="M 656 225 L 702 225" stroke="#0284c7" stroke-width="2.5" />
  <polygon points="702,219 714,225 702,231" fill="#0284c7" />

  <!-- Step 3: Thread Tracker -->
  <g transform="translate(720, 110)">
    <rect width="250" height="230" rx="12" fill="#ffffff" />
    <rect width="250" height="46" rx="12" fill="#f5f3ff" />
    <line x1="0" y1="46" x2="250" y2="46" stroke="#6d28d9" stroke-opacity="0.25" />
    <rect width="250" height="230" rx="12" fill="none" stroke="#6d28d9" stroke-width="2" />
    <text x="16" y="29" fill="#2e1065" font-family="Consolas, monospace" font-size="13" font-weight="700">3 · Flock Thread Tracker</text>
    <text x="16" y="74" fill="#0f172a" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="600">Local Knowledge Coordinator</text>
    <text x="16" y="100" fill="#334155" font-family="Consolas, monospace" font-size="11">• Strictly passive when idle</text>
    <text x="16" y="120" fill="#334155" font-family="Consolas, monospace" font-size="11">• Searches permitted local</text>
    <text x="16" y="138" fill="#334155" font-family="Consolas, monospace" font-size="11">  session metadata and threads</text>
    <text x="16" y="156" fill="#334155" font-family="Consolas, monospace" font-size="11">  only within current authority</text>
    <text x="16" y="182" fill="#334155" font-family="Consolas, monospace" font-size="11">• Targeted questions; approved</text>
    <text x="16" y="200" fill="#334155" font-family="Consolas, monospace" font-size="11">  scoped replies, not raw dumps</text>
  </g>

  <!-- Arrow 3 -> 4 -->
  <path d="M 976 225 L 1012 225" stroke="#6d28d9" stroke-width="2.5" />
  <polygon points="1012,219 1024,225 1012,231" fill="#6d28d9" />

  <!-- Step 4: Delivery Receipt -->
  <g transform="translate(1030, 110)">
    <rect width="190" height="230" rx="12" fill="#ffffff" />
    <rect width="190" height="46" rx="12" fill="#fffbeb" />
    <line x1="0" y1="46" x2="190" y2="46" stroke="#d97706" stroke-opacity="0.25" />
    <rect width="190" height="230" rx="12" fill="none" stroke="#d97706" stroke-width="2" />
    <text x="16" y="29" fill="#78350f" font-family="Consolas, monospace" font-size="13" font-weight="700">4 · Receipt</text>
    <text x="16" y="74" fill="#0f172a" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="600">Admission, Not Execution</text>
    <text x="16" y="100" fill="#334155" font-family="Consolas, monospace" font-size="11">• Check receipt stage</text>
    <text x="16" y="118" fill="#334155" font-family="Consolas, monospace" font-size="11">  and session evidence</text>
    <text x="16" y="144" fill="#334155" font-family="Consolas, monospace" font-size="11">• UNKNOWN stays unknown</text>
    <text x="16" y="162" fill="#334155" font-family="Consolas, monospace" font-size="11">  No blind redispatch</text>
    <text x="16" y="180" fill="#334155" font-family="Consolas, monospace" font-size="11">• No loss-proof claim</text>
  </g>
</svg>
